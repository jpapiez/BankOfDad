name: bankofdad

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankofdad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankofdad-dev}
      POSTGRES_DB: ${POSTGRES_DB:-bankofdad}
    # Loopback only: the database is never exposed on the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankofdad} -d ${POSTGRES_DB:-bankofdad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Use the NuGet v3 service index by default; NUGET_SOURCE can point at
        # a reachable internal mirror or another package feed.
        NUGET_SOURCE: ${NUGET_SOURCE:-https://api.nuget.org/v3/index.json}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: "8080"
      # Let Kestrel bind before migrations so Compose can expose a deterministic
      # liveness endpoint while the readiness gate waits for the schema.
      Database__StartBeforeMigrations: "true"
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-bankofdad};Username=${POSTGRES_USER:-bankofdad};Password=${POSTGRES_PASSWORD:-bankofdad-dev}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}
      Apple__ClientId: ${APPLE_CLIENT_ID:-com.example.bankofdad}
      Apple__TeamId: ${APPLE_TEAM_ID:-}
      Apple__KeyId: ${APPLE_KEY_ID:-}
      Apple__KeyPath: ${APPLE_KEY_PATH:-/run/secrets/apple/SignInWithAppleKey.p8}
      Apple__TokenEncryptionKey: ${APPLE_TOKEN_ENCRYPTION_KEY:-}
      Apns__KeyId: ${APNS_KEY_ID:-}
      Apns__TeamId: ${APNS_TEAM_ID:-}
      Apns__BundleId: ${APNS_BUNDLE_ID:-com.example.bankofdad}
      Apns__UseSandbox: ${APNS_USE_SANDBOX:-true}
      Apns__KeyPath: ${APNS_KEY_PATH:-/run/secrets/apple/AuthKey.p8}
      # Development-only UI-test endpoints (/api/v1/testing). Ignored unless ASPNETCORE_ENVIRONMENT=Development.
      TestHooks__Enabled: ${TEST_HOOKS_ENABLED:-false}
    ports:
      - "8080:8080"
    volumes:
      - ./secrets:/run/secrets/apple:ro
    healthcheck:
      # The API writes this only after Kestrel is listening and migrations finish.
      test: ["CMD-SHELL", "test -f /tmp/bankofdad-ready"]
      interval: 1s
      timeout: 1s
      retries: 60

  # `docker compose up -d` waits for this dependent service, making the
  # documented health curl deterministic immediately after startup.
  api-ready:
    image: ${COMPOSE_PROJECT_NAME:-bankofdad}-api
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: ["while :; do sleep 3600; done"]

volumes:
  pgdata:
