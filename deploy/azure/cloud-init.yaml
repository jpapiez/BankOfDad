#cloud-config
# First boot of the Bank of Dad VM: Docker, swap, and unattended OS updates.
# No app configuration or secrets here; deploy/azure/update.sh pushes those afterwards.
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - jq

# 1 GiB VMs need swap for .NET + Postgres.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "local", "log-opts": {"max-size": "10m", "max-file": "3"}}
  # Security updates (Ubuntu default) plus Docker Engine, rebooting at 11:00 UTC (early morning in the US) when required.
  - path: /etc/apt/apt.conf.d/52bankofdad-unattended-upgrades
    content: |
      Unattended-Upgrade::Origins-Pattern {
        "origin=Docker,label=Docker CE,codename=${distro_codename}";
      };
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "11:00";

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  - install -d -m 0700 /opt/bankofdad
