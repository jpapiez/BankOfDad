name: BankOfDad
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
# API_BASE_URL, the bundle ID and the signing team live in Config/App.xcconfig (override per machine in Config/Local.xcconfig).
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
targets:
  BankOfDad:
    type: application
    platform: iOS
    sources:
      - path: BankOfDad
        excludes:
          - Resources
      - path: BankOfDad/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANKOFDAD_BUNDLE_ID)
        INFOPLIST_FILE: BankOfDad/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BankOfDad/Resources/BankOfDad.entitlements
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        # iPhone only; iPads run it in iPhone compatibility mode.
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - BankOfDadTests
        # End-to-end UI tests need the Docker backend; run them with scripts/run-ui-tests.sh.
        - BankOfDadUITests
      gatherCoverageData: true
    info:
      path: BankOfDad/Resources/Info.plist
      properties:
        CFBundleDisplayName: Bank of Dad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS is used, so no export-compliance documentation is needed.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        API_BASE_URL: $(API_BASE_URL)
        NSCameraUsageDescription: Camera access lets kids scan pairing QR codes from their parent.
        NSLocalNetworkUsageDescription: Bank of Dad uses your local network to connect to your family's private server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).pairing
            CFBundleURLSchemes:
              - bankofdad
        UIBackgroundModes:
          - remote-notification
  BankOfDadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BankOfDadTests
    dependencies:
      - target: BankOfDad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANKOFDAD_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  BankOfDadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BankOfDadUITests
    dependencies:
      - target: BankOfDad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANKOFDAD_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BankOfDad
